  <style>
/* TERANG-KOP — token dan komponen.
   Struktur turunan Wise (Inter, tombol pil, kartu 24 px, kontras permukaan sebagai elevasi),
   warna dari logo: hijau koperasi sebagai merek, kuning amber sebagai aksen pertumbuhan. */

:root {
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;

  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;

  --z-sticky: 10; --z-nav: 20; --z-fab: 30; --z-sheet: 40; --z-toast: 50;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --t-fast: 160ms; --t-med: 240ms;

  color-scheme: light;
  --canvas: oklch(0.965 0.008 172);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.935 0.012 172);
  --surface-3: oklch(0.905 0.016 172);
  --line: oklch(0.88 0.012 172);
  --line-strong: oklch(0.62 0.02 172);
  --ink: oklch(0.21 0.02 172);
  --body: oklch(0.36 0.016 172);
  --mute: oklch(0.47 0.014 172);

  --brand: oklch(0.49 0.085 172);
  --brand-hover: oklch(0.43 0.08 172);
  --on-brand: oklch(1 0 0);
  --brand-pale: oklch(0.925 0.04 168);
  --brand-ink: oklch(0.33 0.07 172);
  --amber: oklch(0.80 0.155 78);
  --amber-ink: oklch(0.36 0.07 70);
  --amber-pale: oklch(0.95 0.06 88);

  --ok-bg: oklch(0.93 0.055 155); --ok-ink: oklch(0.36 0.09 155); --ok-mark: oklch(0.58 0.14 155);
  --warn-bg: oklch(0.94 0.075 85); --warn-ink: oklch(0.40 0.085 65); --warn-mark: oklch(0.70 0.15 70);
  --bad-bg: oklch(0.93 0.04 25); --bad-ink: oklch(0.45 0.16 27); --bad-mark: oklch(0.58 0.19 27);
  --cal-bg: oklch(0.93 0.025 250); --cal-ink: oklch(0.40 0.07 255); --cal-mark: oklch(0.58 0.09 255);

  --focus: oklch(0.55 0.13 230);
  --shadow-pop: 0 1px 2px oklch(0.2 0.02 172 / .08), 0 12px 32px oklch(0.2 0.02 172 / .14);
  --scrim: oklch(0.15 0.02 172 / .45);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: oklch(0.175 0.012 172);
  --surface: oklch(0.225 0.014 172);
  --surface-2: oklch(0.265 0.016 172);
  --surface-3: oklch(0.31 0.018 172);
  --line: oklch(0.33 0.016 172);
  --line-strong: oklch(0.55 0.02 172);
  --ink: oklch(0.95 0.008 172);
  --body: oklch(0.86 0.01 172);
  --mute: oklch(0.74 0.012 172);
  --brand: oklch(0.74 0.11 172);
  --brand-hover: oklch(0.80 0.10 172);
  --on-brand: oklch(0.18 0.03 172);
  --brand-pale: oklch(0.32 0.05 172);
  --brand-ink: oklch(0.86 0.08 172);
  --amber: oklch(0.80 0.155 78);
  --amber-ink: oklch(0.88 0.10 85);
  --amber-pale: oklch(0.32 0.06 80);
  --ok-bg: oklch(0.32 0.06 155); --ok-ink: oklch(0.88 0.10 155); --ok-mark: oklch(0.72 0.15 155);
  --warn-bg: oklch(0.33 0.06 80); --warn-ink: oklch(0.90 0.11 85); --warn-mark: oklch(0.80 0.15 78);
  --bad-bg: oklch(0.32 0.07 25); --bad-ink: oklch(0.88 0.08 25); --bad-mark: oklch(0.70 0.18 27);
  --cal-bg: oklch(0.32 0.04 255); --cal-ink: oklch(0.88 0.05 255); --cal-mark: oklch(0.72 0.10 255);
  --focus: oklch(0.78 0.12 230);
  --shadow-pop: 0 1px 2px oklch(0 0 0 / .3), 0 16px 40px oklch(0 0 0 / .45);
  --scrim: oklch(0.08 0.01 172 / .6);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
a, button, input, select, textarea, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
  background: var(--canvas); font-feature-settings: "calt", "tnum" 0; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.875rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.25rem; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.0625rem; line-height: 1.35; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--brand-ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .875rem; }
.mute { color: var(--mute); }
.body { color: var(--body); }
.small { font-size: .875rem; line-height: 1.45; }
.xs { font-size: .8125rem; line-height: 1.4; }
.strong { font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--canvas); padding: 10px 16px; border-radius: var(--r-pill); z-index: var(--z-toast); }
.skip:focus { top: 12px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }

/* ---------- Kerangka ---------- */
.topbar {
  position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--s4);
  min-height: 64px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { width: 38px; height: 44px; flex: none; }
.brand b { display: block; font-weight: 800; letter-spacing: .01em; font-size: 1rem; line-height: 1.2; }
.brand span { display: block; font-size: .875rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.conn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill);
  border: 0; cursor: pointer; font-weight: 600; font-size: .9375rem; background: var(--ok-bg); color: var(--ok-ink);
  transition: background var(--t-fast) var(--ease);
}
.conn[data-online="false"] { background: var(--warn-bg); color: var(--warn-ink); }
.conn .count { background: var(--warn-ink); color: var(--warn-bg); border-radius: var(--r-pill); padding: 0 7px; font-size: .75rem; line-height: 20px; }
.user {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px 4px 4px; border-radius: var(--r-pill);
  border: 0; background: transparent; cursor: pointer; text-align: left;
}
.user:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-weight: 700; font-size: .8125rem; flex: none; }
.user .who b { display: block; font-size: .9375rem; font-weight: 600; line-height: 1.2; }
.user .who span { display: block; font-size: .8125rem; color: var(--mute); }

.banner {
  display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; align-items: center;
  padding: 7px 20px; background: var(--amber-pale); color: var(--amber-ink); font-size: .875rem; border-bottom: 1px solid var(--line);
}
.banner b { font-weight: 700; }

.layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: calc(100vh - 100px); }
.sidenav { padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px); overflow-y: auto; }
.sidenav a {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: var(--r-pill);
  color: var(--ink); text-decoration: none; font-weight: 600; font-size: .9375rem;
  transition: background var(--t-fast) var(--ease);
}
.sidenav a:hover { background: var(--surface-2); }
.sidenav a[aria-current="page"] { background: var(--brand-pale); color: var(--brand-ink); }
.sidenav .sep { height: 1px; background: var(--line); margin: 12px 8px; }
.sidenav .meta { padding: 0 16px; font-size: .8125rem; color: var(--mute); margin-top: 4px; }
.badge-dot { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--r-pill); background: var(--bad-mark); color: #fff; font-size: .75rem; font-weight: 700; display: grid; place-items: center; }

main { padding: 32px 32px 120px; min-width: 0; }
.page { max-width: 1180px; }
#judul:focus { outline: none; } /* fokus terprogram untuk pembaca layar; judul bukan kontrol */
/* Paragraf prosa rata kiri-kanan di layar lebar; di ponsel tetap rata kiri agar spasi antarkata tidak melebar. */
@media (min-width: 768px) {
  .card p.body, .card > p, .callout p, .empty p, .stack.sm.body li, .lp-intro-text p, .lp-letter p, .lp-show-index > p, .lp-fase li, .lp-kpi dd, .lp-lead, .lp-cta-text p, .lp-credit {
    text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto;
  }
}
/* Kartu info koperasi di bilah samping */
.side-info { margin-top: 20px; padding: 18px; border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.side-info .side-logo svg { width: 34px; height: 40px; margin-bottom: 8px; }
.side-info b { font-size: .9375rem; line-height: 1.3; }
.side-info > span { font-size: .8125rem; color: var(--body); }
.side-info .side-skor { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
/* Kartu hero anggota: bidang hijau tua, angka besar */
.card.hero-card { background: oklch(0.29 0.05 172); color: oklch(0.97 0.01 172); }
.card.hero-card h2 { color: inherit; }
.card.hero-card .label { color: oklch(0.85 0.03 172); }
.card.hero-card .kv b { color: #fff; }
.hero-num { font-size: clamp(2.25rem, 3.4vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 14px 0 18px; color: var(--amber); font-variant-numeric: tabular-nums; }
.hero-note { margin-top: 16px; font-size: .875rem; color: oklch(0.85 0.03 172); }
/* Deret angka kunci pengurus */
.kpi-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; margin-bottom: 16px; overflow: hidden; }
.kpi { padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi b { font-size: clamp(1.125rem, 1.8vw, 1.5rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; }
.kpi b.warn { color: var(--warn-ink); }
/* Sebaran status wilayah */
.dist-bar { display: flex; gap: 4px; height: 18px; border-radius: var(--r-pill); overflow: hidden; }
.dist-bar i { display: block; min-width: 8px; }
.dist-bar .sehat { background: var(--ok-mark); } .dist-bar .waspada { background: var(--warn-mark); }
.dist-bar .tindakan { background: var(--bad-mark); } .dist-bar .kalibrasi { background: repeating-linear-gradient(135deg, var(--cal-mark) 0 4px, var(--cal-bg) 4px 8px); }
.dist-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.dist-item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.dist-item b { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
.page-head p { color: var(--body); margin-top: 6px; max-width: 68ch; }
.crumb { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; color: var(--brand-ink); text-decoration: none; margin-bottom: 10px; min-height: 32px; }

.tabbar { display: none; }

/* ---------- Kartu dan tata letak ---------- */
.card { background: var(--surface); border-radius: var(--r-xl); padding: 24px; min-width: 0; }
.card.tint { background: var(--surface-2); }
.card.pale { background: var(--brand-pale); }
.card.flat { background: transparent; border: 1px solid var(--line); }
.card-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.lg { gap: 24px; }
.stack.sm { gap: 8px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.span2 { grid-column: span 2; }
hr.div { border: 0; height: 1px; background: var(--line); margin: 4px 0; }

.big { font-size: 2.25rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mid { font-size: 1.375rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.label { font-size: .875rem; color: var(--mute); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 20px; }
.kv > div > b { display: block; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; }
.dl dt { color: var(--mute); font-size: .9375rem; }
.dl dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Tombol ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
  border-radius: var(--r-pill); border: 1px solid transparent; font-weight: 600; font-size: 1rem; line-height: 1.2;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.secondary:hover { background: var(--surface-3); }
.btn.outline { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.outline:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad-ink); color: #fff; }
.btn.danger:hover { filter: brightness(1.08); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--brand-ink); padding: 0 12px; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: .9375rem; }
.btn.block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }

/* ---------- Status dan lencana ---------- */
.status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; border-radius: var(--r-pill); font-size: .875rem; font-weight: 600; line-height: 1.4; white-space: nowrap; }
.status.sehat { background: var(--ok-bg); color: var(--ok-ink); }
.status.waspada { background: var(--warn-bg); color: var(--warn-ink); }
.status.tindakan { background: var(--bad-bg); color: var(--bad-ink); }
.status.kalibrasi { background: var(--cal-bg); color: var(--cal-ink); }
.status.netral { background: var(--surface-2); color: var(--body); }
.status.lg { font-size: 1rem; padding: 6px 14px 6px 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--body); font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.chip.late { background: var(--bad-ink); color: #fff; }
.chip.amber { background: var(--amber-pale); color: var(--amber-ink); }

/* ---------- Foto hero dan pita angka ---------- */

.lp-alur-text:has(.lp-step.on) .lp-step:not(.on) .lp-step-t { color: var(--mute); }
.lp-step-s { color: var(--ink); max-width: 44ch !important; }
.lp-step-img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--r-lg); max-width: 420px; margin-top: 8px; }
.lp-alur-stage { grid-column: 7 / span 6; position: sticky; top: 12vh; min-height: 76vh; background: var(--surface-2); border-radius: var(--r-xl); display: grid; place-items: center; padding: 40px; margin-top: 72px; }
.lp-alur-stage .lp-frag { width: min(520px, 100%); }
#lp-alur-frag[data-active="0"] [data-state="0"], #lp-alur-frag[data-active="1"] [data-state="1"], #lp-alur-frag[data-active="2"] [data-state="2"] { display: block; animation: lp-fade 240ms var(--ease); }

.lp-show { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: center; }

.lp-names button:hover { color: var(--body); transform: translateX(4px); }
.lp-names button[aria-selected="true"] { color: var(--ink); }
.lp-show-stage { grid-column: 7 / span 6; background: var(--surface-2); border-radius: var(--r-xl); max-height: 720px; overflow: hidden; padding: 56px 0 0 64px; }
.lp .lp-sheet[data-ui] { color: #161a19; }
.lp-sheet { width: 560px; max-width: none; background: #fff; color: #161a19; border-radius: 6px 6px 0 0; padding: 32px 34px 40px; display: flex; flex-direction: column; gap: 16px; font-size: .875rem; transition: opacity 160ms var(--ease); }
.lp-sheet.swap { opacity: 0; }
.lp-sheet-head { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #1a7060; }
.lp-sheet-head svg { width: 30px; height: 36px; flex: none; }
.lp-sheet-head b { display: block; font-size: 1rem; color: #161a19; }
.lp-sheet-head span { display: block; color: #4b5552; font-size: .8125rem; }
.lp-sheet table { width: 100%; border-collapse: collapse; }
.lp-sheet td, .lp-sheet th { padding: 7px 0; border-bottom: 1px solid #dfe5e2; text-align: left; vertical-align: top; }
.lp-sheet th { font-size: .8125rem; color: #4b5552; font-weight: 600; }
.lp-sheet .r { text-align: right; padding-left: 12px; white-space: nowrap; }
.lp-sheet tr.tot td { font-weight: 700; }
.lp-sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.lp-sheet p { max-width: none; }
.lp-sheet .hash { color: #4b5552; }
.lp-sheet-foot { color: #4b5552; font-size: .8125rem; margin-top: 8px; }

.lp-hitung { background: var(--lp-deep); color: var(--lp-on-deep); min-height: 88svh; padding-top: 80px !important; padding-bottom: 72px !important; display: flex; flex-direction: column; justify-content: space-between; gap: 64px; }
.lp-hitung h2 { color: inherit; }
.lp-slider { width: min(420px, 100%); margin-top: 28px; background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 16px 18px; }
.lp-slider label { font-weight: 600; font-size: .875rem; display: block; margin-bottom: 6px; }
.lp-slider input[type="range"] { flex: 1; min-height: 44px; accent-color: var(--brand); }
.lp-slider output { font-weight: 800; font-size: 1.25rem; min-width: 3ch; text-align: right; }
.lp-hitung-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
.lp-figure { font-size: clamp(7rem, 17vw, 16rem); line-height: .82; font-weight: 800; letter-spacing: -0.045em; color: var(--amber); max-width: none !important; }
.lp-figure .unit { font-size: .22em; letter-spacing: -0.01em; margin-left: .2em; color: var(--lp-on-deep); }
.lp-formula { font-size: 1.0625rem; color: var(--lp-on-deep-soft); max-width: 34ch !important; padding-bottom: 12px; }

.lp-pilot { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: start; }
.lp-pilot-text { grid-column: 1 / span 6; display: flex; flex-direction: column; gap: 28px; }
.lp-pilot-fig { grid-column: 8 / span 5; position: sticky; top: 12vh; }
.lp-fase { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.lp-fase li { max-width: 60ch; }
.lp-kpi { margin: 0; display: grid; gap: 8px; }
.lp-kpi > div { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: baseline; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); }
.lp-kpi dt { font-weight: 800; font-size: 1.375rem; color: var(--brand-ink); }
.lp-kpi dd { margin: 0; }

.lp-surat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: center; }

.lp-surat-fig img { aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--r-xl); }
.lp-letter { grid-column: 8 / span 5; display: flex; flex-direction: column; gap: 18px; max-width: 520px; }

.lp-sign { font-size: 1.625rem !important; font-weight: 700; font-style: italic; margin-top: 8px; }

.lp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lp-tile { aspect-ratio: 3 / 2; background: var(--surface-2); border-radius: var(--r-xl); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }

.lp-tile span { color: var(--body); font-weight: 500; }
.lp-tile.lead { grid-column: span 2; aspect-ratio: auto; background: var(--brand); color: var(--on-brand); }

.lp-cta { background: var(--brand); color: var(--on-brand); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: end; padding-top: 120px !important; padding-bottom: 120px !important; }
.lp-cta-text { grid-column: 1 / span 5; align-self: end; display: flex; flex-direction: column; gap: 18px; }
.lp-cta-text h2 { color: inherit; font-size: clamp(3.25rem, 6.4vw, 6rem); line-height: .94; letter-spacing: -0.04em; }
.lp-cta-text p { font-size: 1.0625rem; max-width: 40ch; }
.lp-dialog { grid-column: 7 / span 5; background: var(--surface); color: var(--ink); border-radius: var(--r-xl); padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-pop); width: min(460px, 100%); justify-self: start; } /* taste-skill-ignore: di dalam potongan data-ui */
.lp-dialog h3 { font-size: 1.25rem; font-weight: 700; }
.lp-seg { display: flex; flex-wrap: wrap; border-radius: var(--r-lg); }
.lp-seg label { flex: 1 1 auto; }
.lp-seg input { position: absolute; opacity: 0; pointer-events: none; }
.lp-seg span { display: grid; place-items: center; min-height: 44px; padding: 0 12px; border-radius: var(--r-pill); font-weight: 600; font-size: .875rem; color: var(--body); cursor: pointer; transition: background var(--t-fast) var(--ease); }
.lp-seg label:hover span { background: var(--surface-3); }
.lp-seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0 0 0 / .14); } /* taste-skill-ignore: di dalam potongan data-ui */
.lp-seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
.lp-dialog [hidden] { display: none; }

.lp-credit { padding: 48px var(--lp-m) 0; font-size: .875rem; color: var(--body); max-width: 110ch; }
.lp-foot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px 24px; align-items: baseline; padding: 24px var(--lp-m) 30px; font-size: .9375rem; color: var(--body); }
.lp-foot nav { display: flex; gap: 24px; }
.lp-foot a { color: var(--ink); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
.lp-foot > span:last-child { text-align: right; }

/* ---------- Gerak ---------- */
.lp .btn { transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.lp .btn:hover { transform: translateY(-1px); }
.lp .btn:active { transform: translateY(0) scale(.98); }
.lp-pre { opacity: 0; transform: translateY(24px); }
.lp-in { opacity: 1; transform: none; transition: opacity 640ms var(--ease), transform 640ms var(--ease); }
@keyframes lp-rise { from { transform: translateY(105%); } }
@keyframes lp-fade-up { from { opacity: 0; transform: translateY(16px); } }
@keyframes lp-fade { from { opacity: 0; } }
@keyframes lp-drift { from { transform: scale(1); } to { transform: scale(1.07) translate(-1.5%, 1%); } }
@media (prefers-reduced-motion: reduce) {
  .lp-line > span, .lp-lead, .lp-hero-copy .row, .lp-hero-stage .lp-frag, .lp-intro-fig img { animation: none !important; }
  .lp-pre { opacity: 1; transform: none; }
}

/* ---------- Tablet dan ponsel ---------- */
@media (max-width: 1100px) {
  .lp-intro-text, .lp-alur-text, .lp-show-index, .lp-cta-text { grid-column: 1 / span 6; }

}

  .lp-intro-text, .lp-intro-fig, .lp-alur-text, .lp-alur-stage, .lp-show-index, .lp-show-stage, .lp-pilot-text, .lp-pilot-fig, .lp-surat-fig, .lp-letter, .lp-cta-text, .lp-dialog { grid-column: 1 / -1; }

  .lp-step-t, .lp-alur-text:has(.lp-step.on) .lp-step:not(.on) .lp-step-t { color: var(--ink); }
  .lp-step-t { font-size: 1.625rem; }
  .lp-names { flex-direction: row; flex-wrap: wrap; gap: 4px 20px; }
  .lp-names button { font-size: 1.625rem; white-space: nowrap; min-height: 44px; }
  .lp-show-stage { max-height: 70svh; padding: 16px 0 0 16px; }
  .lp-show-stage { padding: 16px 16px 0; }
  .lp-sheet { width: 100%; padding: 20px; }
  .lp-hitung { min-height: 84svh; padding-top: 56px !important; }

  .lp-slider { width: 100%; }
  .lp-figure { font-size: 30vw; }
  .lp-figure .unit { display: block; font-size: 1.25rem; margin: 10px 0 0; }
  .lp-surat-fig img { aspect-ratio: 4 / 3; }
  .lp-pilot-fig { position: static; }
  .lp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .lp-tile { padding: 16px; }
  .lp-tile b { font-size: 1.25rem; }
  .lp-tile.lead { min-height: 120px; }
  .lp-cta { padding-top: 72px !important; padding-bottom: 72px !important; }
  .lp-cta-text { align-self: start; }
  .lp-cta-text h2 { font-size: 13vw; }
  .lp-dialog { padding: 20px; }
  .lp-dialog .btn { min-height: 52px; }
  .lp-foot { grid-template-columns: 1fr; padding-top: 16px; gap: 8px; }
  .lp-data dl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px 20px; }
  .lp-data { padding: 40px 20px !important; }
  .lp-hero-fig { max-height: 34svh; min-height: 160px; }
  .lp-wordmark { margin-top: 64px; padding: 0 20px; }
  .lp-foot > span:last-child { text-align: left; }
}
@media (max-width: 420px) {
  .lp-ind li { grid-template-columns: 26px 1fr auto; }
  .lp-ind li .ind { grid-column: 2 / -1; padding-bottom: 6px; }
}

      if (st !== 'Terbuka') galat.push({ field: 'tanggal', pesan: 'Periode ' + namaPeriode(periodeOf(draft.tanggal)) + ' sudah ditutup. Catat koreksi di periode berjalan dengan entri pembalik.' });
      if (draft.tanggal > state.tanggalSimulasi) galat.push({ field: 'tanggal', pesan: 'Tanggal tidak boleh melewati hari ini (' + fmtTgl(state.tanggalSimulasi) + ').' });
      if (draft.tanggal < state.koperasi.mulai_buku) galat.push({ field: 'tanggal', pesan: 'Tanggal sebelum awal buku koperasi.' });
    }
    if (def.anggota && !draft.anggota_id) galat.push({ field: 'anggota_id', pesan: 'Pilih anggota.' });
    if (draft.jenis === 'T06' || draft.jenis === 'T11') {
      if (!bulat(draft.pokok) || draft.pokok < 0) galat.push({ field: 'pokok', pesan: 'Pokok harus bilangan bulat rupiah.' });
      if (!bulat(draft.jasa) || draft.jasa < 0) galat.push({ field: 'jasa', pesan: draft.jenis === 'T06' ? 'Jasa harus bilangan bulat rupiah.' : 'Bunga harus bilangan bulat rupiah.' });
      if ((draft.pokok || 0) + (draft.jasa || 0) <= 0) galat.push({ field: 'pokok', pesan: 'Nominal harus lebih dari nol.' });
    } else if (draft.jenis !== 'T13') {
      if (!bulat(draft.nominal) || draft.nominal <= 0) galat.push({ field: 'nominal', pesan: 'Nominal harus bilangan bulat rupiah lebih dari nol, tanpa sen.' });
    }
    if (draft.jenis === 'T06') {
      var p = state.pinjaman.filter(function (x) { return x.id === draft.pinjaman_id; })[0];
      if (!p) galat.push({ field: 'pinjaman_id', pesan: 'Pilih pinjaman yang diangsur.' });
      else {
        if (p.anggota_id !== draft.anggota_id) galat.push({ field: 'pinjaman_id', pesan: 'Pinjaman ini bukan milik anggota yang dipilih.' });
        var stp = statusPinjaman(state, p, draft.tanggal || state.tanggalSimulasi);
        if (stp && draft.pokok > stp.sisa) { galat.push({ field: 'pokok', pesan: 'Pokok melebihi sisa pinjaman. Isi paling banyak ' + rp(stp.sisa) + '.' }); tinjau = true; }
      }
    }
    if (draft.jenis === 'T05') {
      if (!bulat(draft.tenor) || draft.tenor < 1 || draft.tenor > 36) galat.push({ field: 'tenor', pesan: 'Tenor 1 sampai 36 bulan.' });
      if (typeof draft.jasa_persen !== 'number' || draft.jasa_persen < 0 || draft.jasa_persen > 5) galat.push({ field: 'jasa_persen', pesan: 'Jasa 0 sampai 5 persen per bulan.' });
    }
    if (draft.jenis === 'T04' && draft.anggota_id && bulat(draft.nominal)) {
      var sal = saldoAnggota(state, draft.anggota_id).sukarela;
      if (draft.nominal > sal) { galat.push({ field: 'nominal', pesan: 'Penarikan ' + rp(draft.nominal) + ' melebihi saldo sukarela anggota. Isi paling banyak ' + rp(sal) + '.' }); tinjau = true; }
    }
    // Uang keluar tidak boleh melebihi saldo kas atau bank (aturan saldo, diperiksa ulang saat sinkron).
    var sumber = { T04: '1101', T05: '1101', T08: '1101', T09: '1101', T11: '1102' }[draft.jenis];
    if (sumber && galat.length === 0) {
      var keluar = draft.jenis === 'T11' ? (draft.pokok || 0) + (draft.jasa || 0) : draft.nominal;
      var saldo = saldoAkun(state.entri, '9999-12-31')[sumber];
      if (keluar > saldo) {
        galat.push({ field: draft.jenis === 'T11' ? 'pokok' : 'nominal', pesan: 'Saldo ' + AKUN[sumber].nama.toLowerCase() + ' tinggal ' + rp(saldo) + ', tidak cukup untuk ' + rp(keluar) + '. Kurangi nominalnya, atau catat dulu uang yang masuk.' });
        tinjau = true;
      }
    }
    if (draft.jenis === 'T13') {
      if (!draft.alasan || draft.alasan.trim().length < 5) galat.push({ field: 'alasan', pesan: 'Tulis alasan koreksi, minimal lima huruf.' });
      var asal = cariEntri(state, draft.entri_asal_id);
      if (!asal) galat.push({ field: 'entri_asal_id', pesan: 'Entri asal tidak ditemukan.' });
      else if (asal.jenis === 'T13') galat.push({ field: 'entri_asal_id', pesan: 'Entri pembalik tidak dapat dibalik lagi. Catat transaksi yang benar sebagai entri baru.' });
      else if (state.entri.some(function (e) { return e.entri_asal_id === asal.id; })) galat.push({ field: 'entri_asal_id', pesan: 'Entri ' + asal.id + ' sudah pernah dibalik.' });
    }
    var baris = buatBaris(draft, state);
    if (galat.length === 0) {
      var d = 0, k = 0;
      baris.forEach(function (b) { d += b.debit || 0; k += b.kredit || 0; if (!bulat(b.debit || 0) || !bulat(b.kredit || 0)) galat.push({ field: 'nominal', pesan: 'Nominal harus bilangan bulat rupiah.' }); });
      if (d !== k) galat.push({ field: 'nominal', pesan: 'Debit dan kredit tidak seimbang. Periksa lagi nominal pokok dan jasa.' });
      if (d <= 0) galat.push({ field: 'nominal', pesan: 'Nominal harus lebih dari nol.' });
    }
    return { ok: galat.length === 0, galat: galat, tinjau: tinjau && galat.every(function (g) { return g.field === 'nominal' || g.field === 'pokok'; }), baris: baris };
  }

  function tambahEntri(state, draft, oleh) {
    var v = validasi(state, draft);
    if (!v.ok) return { ok: false, galat: v.galat, tinjau: v.tinjau };
    if (draft.cid && state.entri.some(function (e) { return e.cid === draft.cid; })) return { ok: true, duplikat: true };
    var prev = state.entri.length ? state.entri[state.entri.length - 1].hash : GENESIS;
    var seq = state.entri.length + 1;
    var e = {
      id: 'E' + ('000' + seq).slice(-4), seq: seq, cid: draft.cid || ('cid-' + seq), tanggal: draft.tanggal,
      jenis: draft.jenis, uraian: draft.uraian || JENIS[draft.jenis].nama,
      anggota_id: draft.anggota_id || null, pinjaman_id: draft.pinjaman_id || null,
      entri_asal_id: draft.entri_asal_id || null, alasan: draft.alasan || null,
      baris: v.baris, oleh: oleh || 'PNG', prev_hash: prev
    };
    if (draft.jenis === 'T05') {
      var pid = draft.pinjaman_id_baru || ('PJ-' + ('0' + (state.pinjaman.length + 1)).slice(-2));
      state.pinjaman.push({ id: pid, anggota_id: draft.anggota_id, pokok: draft.nominal, tenor: draft.tenor, jasa_persen: draft.jasa_persen, tanggal_cair: draft.tanggal });
      e.pinjaman_id = pid;
    }
    if (draft.jenis === 'T13') {
      var asal = cariEntri(state, draft.entri_asal_id);
      e.anggota_id = asal.anggota_id; e.pinjaman_id = asal.pinjaman_id;
      e.uraian = 'Koreksi ' + asal.id + ': ' + draft.alasan.trim();
    }
    e.hash = hashEntri(e, prev);
    state.entri.push(e);
    return { ok: true, entri: e };
  }

  /* ---------- Sinkron luring ---------- */
  function sinkron(state, oleh) {
    var hasil = { masuk: [], tinjau: [], duplikat: [] };
    var sisa = [];
    (state.antrean || []).forEach(function (q) {
      if (q.status === 'Perlu ditinjau') { sisa.push(q); return; }
      var r = tambahEntri(state, q.draft, oleh);
      if (r.ok && r.duplikat) hasil.duplikat.push(q);
      else if (r.ok) { hasil.masuk.push(r.entri); }
      else { q.status = 'Perlu ditinjau'; q.galat = r.galat; hasil.tinjau.push(q); sisa.push(q); }
    });
    state.antrean = sisa;
    return hasil;
  }

  /* ---------- Periode, tutup buku, tiket ---------- */
  function cariPeriode(state, id) {
    for (var i = 0; i < state.periode.length; i++) if (state.periode[i].id === id) return state.periode[i];
    return null;
  }
  function periodeBerjalan(state) {
    var buka = state.periode.filter(function (p) { return p.status === 'Terbuka'; });
    return buka.length ? buka[0] : null;
  }
  function ambangAktif(state) { return state.ambang[state.ambang.length - 1]; }
  function cariAmbang(state, versi) { return state.ambang.filter(function (a) { return a.versi === versi; })[0] || ambangAktif(state); }

  function nomorTiketBerikut(state) {
    var max = state.nomorTiket || 0;
    state.nomorTiket = max + 1;
    return 'TK-' + ('00' + state.nomorTiket).slice(-3);
  }

  function buatTiketDariSkor(state, periodeId, skor, tanggal) {
    var dibuat = [];
    if (skor.status === 'Waspada') {
      var t = {
        id: nomorTiketBerikut(state), koperasi_id: state.koperasi.id, periode_id: periodeId, jenis: 'Pendampingan',
        status: 'Terbuka', dibuat: tanggal, tenggat: addWorkingDays(tanggal, 7),
        pemilik: 'KJD', pemilik_nama: state.koperasi.pendamping_utama, salinan: [state.koperasi.pendamping_cadangan],
        ringkasan: 'Skor ' + namaPeriode(periodeId) + ' ' + skor.nilai + ', Waspada. Kontak pertama dengan pengurus dalam 7 hari kerja.',
        penjelasan: '', catatan: []
      };
      state.tiket.push(t); dibuat.push(t);
    }
    if (skor.status === 'Perlu tindakan') {
      var t2 = {
        id: nomorTiketBerikut(state), koperasi_id: state.koperasi.id, periode_id: periodeId, jenis: 'Tindak lanjut',
        status: 'Terbuka', dibuat: tanggal, tenggat: addDays(tanggal, 14),
        pemilik: 'PNG', pemilik_nama: 'Pengurus ' + state.koperasi.nama_pendek,
        salinan: ['Pengawas', 'Dinas Koperasi', state.koperasi.pendamping_utama],
        ringkasan: 'Skor ' + namaPeriode(periodeId) + ' ' + skor.nilai + ', Perlu tindakan. Penyebab utama: ' +
          skor.penurun.slice(0, 2).map(function (i) { return i.nama.toLowerCase(); }).join(' dan ') + '.',
        penjelasan: '', catatan: []
      };
      state.tiket.push(t2); dibuat.push(t2);
    }
    return dibuat;
  }

  function pratinjauSkor(state, periodeId, asOf) {
    var r = ringkasanPeriode(state, periodeId, asOf);
    return { ringkasan: r, skor: hitungSkor(r, ambangAktif(state)) };
  }

  function tutupBuku(state, periodeId, oleh) {
    var p = cariPeriode(state, periodeId);
    if (!p) return { ok: false, pesan: 'Periode tidak ditemukan.' };
    if (p.status !== 'Terbuka') return { ok: false, pesan: 'Periode ' + namaPeriode(periodeId) + ' sudah ditutup.' };
    var sebelum = state.periode.filter(function (x) { return x.id < periodeId && x.status === 'Terbuka'; });
    if (sebelum.length) return { ok: false, pesan: 'Tutup dulu periode ' + namaPeriode(sebelum[0].id) + '.' };
    var menunggu = (state.antrean || []).filter(function (q) { return periodeOf(q.draft.tanggal) === periodeId; });
    if (menunggu.length) return { ok: false, pesan: 'Masih ada ' + menunggu.length + ' entri di antrean untuk periode ini. Sinkronkan atau tinjau dulu.' };
    var tanggal = state.tanggalSimulasi;
    var asOf = minTgl(akhirPeriode(periodeId), tanggal);
    var amb = ambangAktif(state);
    var r = ringkasanPeriode(state, periodeId, asOf);
    var sk = hitungSkor(r, amb);
    p.status = 'Ditutup'; p.ditutup_pada = tanggal; p.ditutup_oleh = oleh || 'PNG'; p.asOf = asOf;
    state.skor = state.skor.filter(function (x) { return x.periode_id !== periodeId; });
    var rec = {
      id: 'SK-' + periodeId, periode_id: periodeId, ambang_versi: amb.versi, asOf: asOf, nilai: sk.nilai, status: sk.status,
      rincian: sk.indikator.map(function (i) { return { kode: i.kode, nilai: i.nilai, warna: i.warna }; }),
      ujung_hash: state.entri.length ? state.entri[state.entri.length - 1].hash : GENESIS
    };
    state.skor.push(rec);
    var tiket = buatTiketDariSkor(state, periodeId, sk, tanggal);
    var berikut = periodeBerikut(periodeId);
    if (!cariPeriode(state, berikut)) state.periode.push({ id: berikut, status: 'Terbuka' });
    return { ok: true, skor: sk, rekam: rec, tiket: tiket };
  }

  function sahkanLaporan(state, periodeId, oleh) {
    var p = cariPeriode(state, periodeId);
    if (!p || p.status !== 'Ditutup') return { ok: false, pesan: 'Hanya laporan yang sudah ditutup yang dapat disahkan.' };
    p.status = 'Terbit'; p.disahkan_pada = state.tanggalSimulasi; p.disahkan_oleh = oleh || 'PGW'; p.terbit_pada = state.tanggalSimulasi;
    // Laporan terbit menutup tiket Pengingat periode itu.
    state.tiket.forEach(function (t) {
      if (t.jenis === 'Pengingat' && t.koperasi_id === state.koperasi.id && t.periode_id === periodeId && t.status !== 'Selesai') {
        t.status = 'Selesai'; t.selesai_pada = state.tanggalSimulasi;
        t.catatan.push({ oleh: 'Sistem', tanggal: state.tanggalSimulasi, teks: 'Laporan ' + namaPeriode(periodeId) + ' terbit. Pengingat ditutup.' });
      }
    });
    return { ok: true };
  }

  /* Pengingat tanggal 10: mulai tanggal 8, bila laporan bulan lalu belum terbit, buat satu tiket
   * untuk pengurus dengan salinan pendamping. Lewat tanggal 10 tiket bertanda Terlambat. */
  function periksaPengingat(state) {
    var hari = state.tanggalSimulasi, dibuat = [];
    if (+hari.slice(8, 10) < 8) return dibuat;
    var pid = periodeSebelum(periodeOf(hari));
    var p = cariPeriode(state, pid);
    if (!p || p.status === 'Terbit') return dibuat;
    if (state.tiket.some(function (t) { return t.jenis === 'Pengingat' && t.koperasi_id === state.koperasi.id && t.periode_id === pid; })) return dibuat;
    var t = {
      id: nomorTiketBerikut(state), koperasi_id: state.koperasi.id, periode_id: pid, jenis: 'Pengingat',
      status: 'Terbuka', dibuat: hari, tenggat: periodeOf(hari) + '-10',
      pemilik: 'PNG', pemilik_nama: 'Pengurus ' + state.koperasi.nama_pendek, salinan: [state.koperasi.pendamping_utama],
      ringkasan: 'Laporan ' + namaPeriode(pid) + ' belum terbit. ' + (p.status === 'Terbuka' ? 'Tutup buku lalu minta pengesahan pengawas' : 'Laporan menunggu pengesahan pengawas') + ' paling lambat tanggal 10.',
      penjelasan: '', catatan: []
    };
    state.tiket.push(t); dibuat.push(t);
    return dibuat;
  }

  function hitungUlang(state) {
    return state.skor.slice().sort(function (a, b) { return a.periode_id < b.periode_id ? -1 : 1; }).map(function (rec) {
      var amb = cariAmbang(state, rec.ambang_versi);
      var r = ringkasanPeriode(state, rec.periode_id, rec.asOf);
      var sk = hitungSkor(r, amb);
      return { periode_id: rec.periode_id, tersimpan: rec.nilai, statusTersimpan: rec.status, hitung: sk.nilai, statusHitung: sk.status,
        sama: sk.nilai === rec.nilai && sk.status === rec.status, ambang_versi: amb.versi };
    });
  }

  /* Pendampingan: tenggatnya kontak pertama, jadi terlambat hanya bila masih Terbuka.
   * Tindak lanjut: terlambat selama belum Selesai. */
  function terlambat(t, tanggal) {
    if (t.status === 'Selesai' || tanggal <= t.tenggat) return false;
    return t.jenis === 'Pendampingan' ? t.status === 'Terbuka' : true;
  }

  /* ---------- e-RAT ---------- */
  function paketRAT(state) {
    var terbit = state.periode.filter(function (p) { return p.status === 'Terbit'; });
    var akhir = terbit.length ? terbit[terbit.length - 1].id : null;
    if (!akhir) return null;
    var tahun = akhir.slice(0, 4) + '-01-01';
    var sampai = akhirPeriode(akhir);
    var lr = labaRugi(state.entri, tahun, sampai);
    var nr = neraca(state.entri, sampai, tahun);
    var sk = state.skor.filter(function (s) { return s.periode_id === akhir; })[0];
    return {
      koperasi: state.koperasi.nama, sampai_periode: akhir, neraca: nr, laba_rugi: lr,
      skor: sk ? { nilai: sk.nilai, status: sk.status } : null,
      usulan_shu: { anggota_persen: 70, cadangan_persen: 30, shu: lr.shu },
      agenda: state.rat.agenda.map(function (a) { return a.judul; }),
      ujung_hash_buku: state.entri.length ? state.entri[state.entri.length - 1].hash : GENESIS
    };
  }
  function terbitkanPaket(state) {
    var rat = state.rat;
    if (rat.status !== 'Dijadwalkan') return { ok: false, pesan: 'Paket sudah terbit dan terkunci.' };
    var isi = paketRAT(state);
    if (!isi) return { ok: false, pesan: 'Belum ada laporan terbit untuk dijadikan paket.' };
    var json = JSON.stringify(isi);
    rat.paket = { isi: isi, json: json, hash: sha256(json), terbit_pada: state.tanggalSimulasi,
      h_minus: diffDays(rat.tanggal, state.tanggalSimulasi) };
    rat.status = 'Paket terbit';
    return { ok: true, paket: rat.paket };
  }
  function periksaPaket(rat) {
    if (!rat.paket) return null;
    return sha256(rat.paket.json) === rat.paket.hash && JSON.stringify(rat.paket.isi) === rat.paket.json;
  }
  function kuorumRAT(state) {
    var hadir = state.rat.kehadiran.length, n = state.anggota.length;
    return { hadir: hadir, anggota: n, perlu: Math.floor(n / 2) + 1, tercapai: hadir > n / 2 };
  }
  function mulaiRAT(state) {
    var rat = state.rat;
    if (rat.status !== 'Paket terbit') return { ok: false, pesan: rat.status === 'Dijadwalkan' ? 'Terbitkan paket RAT dulu.' : 'RAT sudah dimulai.' };
    rat.status = 'Berlangsung';
    rat.dimulai_pada = state.tanggalSimulasi;
    rat.kode_hadir = String(1000 + parseInt(sha256(rat.id + state.tanggalSimulasi + rat.paket.hash).slice(0, 6), 16) % 9000);
    return { ok: true, kode: rat.kode_hadir };
  }
  /* kode = null berarti pengurus menandai hadir langsung dari daftar hadir. */
  function catatHadir(state, anggotaId, kode) {
    var rat = state.rat;
    if (rat.status !== 'Berlangsung') return { ok: false, pesan: 'Daftar hadir dibuka saat RAT berlangsung.' };
    var a = state.anggota.filter(function (x) { return x.id === anggotaId; })[0];
    if (!a) return { ok: false, pesan: 'Anggota tidak ditemukan.' };
    if (kode !== null && String(kode).trim() !== rat.kode_hadir) return { ok: false, pesan: 'Kode hadir tidak cocok. Lihat kode empat angka yang ditampilkan pengurus di tempat rapat, lalu coba lagi.' };
    if (rat.kehadiran.some(function (k) { return k.anggota_id === anggotaId; })) return { ok: true, sudah: true };
    rat.kehadiran.push({ anggota_id: anggotaId, hadir_pada: state.tanggalSimulasi });
    return { ok: true };
  }
  function kirimSuara(state, agendaId, anggotaId, pilihan) {
    var rat = state.rat;
    if (rat.status !== 'Berlangsung') return { ok: false, pesan: 'Pemungutan suara hanya saat RAT berlangsung.' };
    if (!rat.kehadiran.some(function (k) { return k.anggota_id === anggotaId; })) return { ok: false, pesan: 'Isi daftar hadir dulu. Hanya anggota yang hadir yang dapat memberi suara.' };
    if (!kuorumRAT(state).tercapai) return { ok: false, pesan: 'Kuorum belum tercapai. Suara dibuka setelah lebih dari separuh anggota hadir.' };
    if (rat.suara.some(function (s) { return s.agenda_id === agendaId && s.anggota_id === anggotaId; })) return { ok: false, pesan: 'Suara Anda untuk agenda ini sudah tercatat dan tidak dapat diubah.' };
    if (['Setuju', 'Tidak setuju', 'Abstain'].indexOf(pilihan) < 0) return { ok: false, pesan: 'Pilih salah satu: Setuju, Tidak setuju, atau Abstain.' };
    rat.suara.push({ agenda_id: agendaId, anggota_id: anggotaId, pilihan: pilihan, dikirim_pada: state.tanggalSimulasi });
    return { ok: true };
  }
  function rekapSuara(state) {
    return state.rat.agenda.map(function (a) {
      var r = { Setuju: 0, 'Tidak setuju': 0, Abstain: 0 };
      state.rat.suara.forEach(function (s) { if (s.agenda_id === a.id) r[s.pilihan]++; });
      var sah = r.Setuju + r['Tidak setuju'] + r.Abstain;
      return { id: a.id, judul: a.judul, rekap: r, total: sah, hasil: sah === 0 ? 'Tidak ada suara' : (r.Setuju > sah / 2 ? 'Diterima' : 'Tidak diterima') };
    });
  }
  function tutupRAT(state) {
    var rat = state.rat;
    if (rat.status !== 'Berlangsung') return { ok: false, pesan: 'RAT belum berlangsung.' };
    var k = kuorumRAT(state);
    rat.status = 'Selesai';
    rat.berita_acara = {
      dibuat_pada: state.tanggalSimulasi, tanggal_rat: rat.tanggal, koperasi: state.koperasi.nama,
      kuorum: k, paket_hash: rat.paket ? rat.paket.hash : null, rekap: rekapSuara(state),
      hadir: rat.kehadiran.map(function (h) { return h.anggota_id; })
    };
    rat.berita_acara.hash = sha256(JSON.stringify(rat.berita_acara));
    return { ok: true, berita_acara: rat.berita_acara };
  }

  /* ---------- Format ---------- */

      var dua = function (a, b) { return '<tr><td>' + a + '</td><td>' + b + '</td></tr>'; };
      return App.pageHead('Tentang prototipe', 'Prototipe ini membuktikan bahwa aturan sistem dapat dijalankan dari data buku besar, bukan bahwa sistem sudah bekerja di lapangan.') +
        '<div class="stack lg"><div class="grid g2"><div class="card"><h2 style="margin-bottom:8px">Yang disimulasikan</h2><ul class="stack sm body" style="padding-left:20px;margin:0"><li>Jurnal ganda T01 sampai T13, koreksi dengan entri pembalik, rantai hash SHA-256</li><li>Antrean luring dan sinkron idempoten</li><li>Skor PEARLS adaptasi dari buku besar, dengan mesin yang sama untuk semua peran</li><li>e-RAT: paket terkunci hash, daftar hadir, suara, berita acara</li><li>Tiket, eskalasi, dasbor dinas dengan 30 koperasi, papan KPI</li></ul></div>' +
        '<div class="card"><h2 style="margin-bottom:8px">Yang tidak disimulasikan</h2><ul class="stack sm body" style="padding-left:20px;margin:0"><li>Otentikasi sungguhan (peran dipilih di layar masuk)</li><li>Sinkronisasi ke server; data hanya di penyimpanan peramban ini</li><li>Notifikasi</li><li>Integrasi Simkopdes dan bank</li><li>Data pribadi nyata</li></ul></div></div>' +
        '<div class="card"><h2 style="margin-bottom:8px">Skenario demonstrasi</h2><p class="body" style="margin-bottom:12px">Jalankan dari tombol Panel demo di pojok kanan bawah.</p><div class="table-wrap"><table class="t"><thead><tr><th>Skenario</th><th>Langkah</th></tr></thead><tbody>' +
        dua('<b>1. Pemulihan</b>', 'Anggota melihat status Waspada September (likuiditas dan kualitas aset kuning). Pengurus beralih luring, mencatat angsuran PJ-04 dan PJ-06 yang menunggak, lalu sinkron. Pratinjau Oktober berubah dari Perlu tindakan menjadi Sehat. Tutup buku, pengawas mengesahkan.') +
        dua('<b>2. RAT</b>', 'Pengurus menerbitkan paket (terkunci hash). Anggota membaca paket. Pengurus memulai RAT; anggota memasukkan kode hadir (kode salah ditolak) dan memberi tiga suara. Pengurus menutup RAT; berita acara terbentuk.') +
        dua('<b>3. Dinas</b>', 'Dinas membuka 30 koperasi, papan KPI, lalu menekan Hitung ulang pada Sukamaju. Hasilnya sama dengan semua periode tersimpan.') +
        dua('<b>4. Perlu tindakan</b>', 'Pengurus mencatat penarikan sukarela Rp1,5 juta dan beban Rp12 juta lalu tutup buku. Status Perlu tindakan, tiket Tindak lanjut bertenggat 14 hari, ringkasannya tampil di beranda anggota.') +
        dua('<b>5. Keutuhan</b>', 'Panel demo mengubah satu entri tanpa menghitung ulang hash. Periksa keutuhan menunjuk entri itu sebagai yang pertama tidak cocok; tombol pulihkan mengembalikan rantai.') +
        '</tbody></table></div></div>' +
        '<div class="card tint"><h2 style="margin-bottom:8px">Batas klaim keamanan</h2><p class="body">Rantai hash membuat perubahan diam-diam terdeteksi, tetapi tidak mencegah pihak yang menguasai server menulis ulang seluruh rantai. Karena itu pengawas dan dinas dapat menjalankan pemeriksaan keutuhan sendiri, dan paket RAT dikunci dengan hash. Ini penanda keutuhan, bukan blockchain dan bukan jaminan keamanan mutlak.</p></div>' +
        '<p><a class="btn outline" href="#/depan">' + icon('home') + 'Buka halaman depan publik</a></p>' +
        '<p class="small mute">Kerangka acuan: Evans, E., &amp; Branch, B. (2002). Technical guide: PEARLS performance monitoring system. World Council of Credit Unions. Pelindungan data pribadi mengacu UU Nomor 27 Tahun 2022. Seluruh ambang dan bobot adalah ambang awal simulasi.</p></div>';
    }
  };
})();

</script>
  <script>
/* TERANG-KOP — layar Anggota. Anggota hanya melihat data dirinya dan angka agregat koperasi. */
(function () {
  'use strict';
  var App = window.App, TK = window.TK, esc = App.esc, icon = App.icon, rp = App.rp, tgl = App.tgl;

  function aku() { return App.anggota(App.session.anggota_id) || App.state.anggota[3]; }
  function catatBuka(id) {
    var s = App.state, hari = App.today();
    if (!s.logRingkasan.some(function (l) { return l.anggota_id === id && l.tanggal === hari; })) {
      s.logRingkasan.push({ anggota_id: id, tanggal: hari });
      App.save();
    }
  }
  function pinjamanSaya(id) {
    return App.state.pinjaman.filter(function (p) { return p.anggota_id === id; }).map(function (p) {
      var st = TK.statusPinjaman(App.state, p, App.today()); st.p = p; return st;
    }).filter(function (x) { return x; });
  }
  function badgePinjaman(st) {
    var m = { 'Lancar': ['sehat', 'check'], 'Terlambat': ['waspada', 'clock'], 'Menunggak': ['tindakan', 'alert'], 'Lunas': ['netral', 'checkCircle'] }[st.status];
    var label = st.status + (st.status === 'Terlambat' || st.status === 'Menunggak' ? ' ' + st.hari_tunggak + ' hari' : '');
    return '<span class="status ' + m[0] + '">' + icon(m[1], 'sm') + label + '</span>';
  }
  App.ui.badgePinjaman = badgePinjaman;
  App.ui.estimasiSHU = function (id, pid) {
    var s = App.state, sampai = TK.tgl.akhirPeriode(pid);
    var lr = TK.labaRugi(s.entri, pid.slice(0, 4) + '-01-01', sampai);
    var milik = TK.saldoAnggota(s, id, sampai);
    var total = 0;
    s.anggota.forEach(function (a) { var x = TK.saldoAnggota(s, a.id, sampai); total += x.pokok + x.wajib; });
    var bagian = Math.max(0, lr.shu) * 0.7;
    return { nilai: total ? Math.round(bagian * (milik.pokok + milik.wajib) / total) : 0, surplus: lr.shu, sampai: sampai };
  };

  /* ---------- Beranda ---------- */
  App.views['ang/beranda'] = {
    title: 'Beranda',
    render: function () {
      var s = App.state, a = aku();
      catatBuka(a.id);
      var sal = TK.saldoAnggota(s, a.id);
      var pj = pinjamanSaya(a.id).filter(function (x) { return x.status !== 'Lunas'; });
      var pt = App.periodeTerbitTerakhir();
      var sk = pt ? App.skorDetail(pt.id) : null;
      var tl = App.tiketKop(s.koperasi.id).filter(function (t) { return t.jenis === 'Tindak lanjut' && t.status !== 'Selesai'; });
      var tlHtml = tl.map(function (t) {
        return '<div class="callout bad">' + icon('octagon') + '<div class="grow stack sm"><p><b>Koperasi Anda berstatus Perlu tindakan untuk ' + TK.namaPeriode(t.periode_id) + '.</b> Pengurus wajib menindaklanjuti dan menjelaskan langkahnya paling lambat ' + App.tglPanjang(t.tenggat) + '.</p>' +
          (t.penjelasan ? '<p><b>Penjelasan pengurus:</b> ' + esc(t.penjelasan) + '</p>' : '<p class="small">Penjelasan tertulis dari pengurus belum dibagikan. Status tiket: ' + esc(t.status) + (App.terlambat(t) ? ', terlambat' : '') + '.</p>') + '</div></div>';
      }).join('');
      var pinjHtml = pj.length ? pj.map(function (st) {
        return '<div class="row between"><span class="mid">' + rp(st.sisa) + '</span>' + badgePinjaman(st) + '</div><p class="small body">Sisa pokok pinjaman ' + st.p.id + '.' +
          (st.tunggakan.length ? ' Ada ' + st.tunggakan.length + ' angsuran tertunggak sejak ' + tgl(st.tunggakan[0].jatuh_tempo) + '.' : '') +
          (st.berikut ? ' Angsuran berikutnya ' + rp(st.berikut.total) + ', jatuh tempo ' + tgl(st.berikut.jatuh_tempo) + '.' : '') + '</p>';
      }).join('<hr class="div">') : '<p class="mid">Rp0</p><p class="small body">Anda tidak punya pinjaman berjalan.</p>';
      var shu = pt ? App.ui.estimasiSHU(a.id, pt.id) : null;
      return App.pageHead('Halo, ' + App.namaDepan(a.nama), 'Ini ringkasan simpanan dan kondisi koperasi Anda per ' + App.tglPanjang(App.today()) + '.') +
        '<div class="stack">' + tlHtml +
        '<div class="grid g2"><section class="card hero-card" aria-labelledby="h-simp"><div class="row between top"><h2 id="h-simp">Simpanan Anda</h2>' + (sk ? App.statusBadge(sk.status) : '') + '</div><p class="hero-num">' + rp(sal.total) + '</p>' +
        '<div class="kv"><div><span class="label">Pokok</span><b>' + rp(sal.pokok) + '</b></div><div><span class="label">Wajib</span><b>' + rp(sal.wajib) + '</b></div><div><span class="label">Sukarela</span><b>' + rp(sal.sukarela) + '</b></div></div>' +
        '<p class="hero-note">Nomor anggota ' + a.no + ' · ' + esc(s.koperasi.nama) + '</p></section>' +
        '<section class="card stack sm" aria-labelledby="h-pinj"><h2 id="h-pinj">Pinjaman Anda</h2>' + pinjHtml + '</section></div>' +
        (sk ? App.ui.ringkasSkor(sk, 'Kesehatan koperasi, ' + TK.namaPeriode(pt.id), '<a class="btn outline sm" href="' + App.href('koperasi') + '">Lihat rincian skor</a>') : '') +
        (shu ? '<section class="card" aria-labelledby="h-shu"><h2 id="h-shu">Perkiraan SHU Anda</h2><p class="mid" style="margin:10px 0">' + rp(shu.nilai) + '</p>' +
          '<p class="small body">Perkiraan bagian anggota 70% dari SHU ' + rp(shu.surplus) + ' per ' + tgl(shu.sampai) + ', dibagi menurut simpanan pokok dan wajib. Angka final ditetapkan RAT.</p></section>' : '') +
        '<div class="row"><a class="btn outline" href="' + App.href('cetak') + '">' + icon('print') + 'Lihat ringkasan cetak</a><a class="btn outline" href="' + App.href('riwayat') + '">' + icon('list') + 'Lihat riwayat transaksi</a></div>' +
        '</div>';
    }
  };

  /* ---------- Riwayat ---------- */
  function arahAnggota(e) {
    var map = { T01: 1, T02: 1, T03: 1, T04: -1, T05: 1, T06: -1 };
    return map[e.jenis] || (e.jenis === 'T13' ? 0 : 0);
  }
  App.views['ang/riwayat'] = {
    title: 'Riwayat',
    render: function (r) {
      var s = App.state, a = aku();
      var f = (r.q && r.q.f) || 'semua';
      var milik = s.entri.filter(function (e) { return e.anggota_id === a.id; });
      var list = milik.filter(function (e) {
        if (f === 'simpanan') return ['T01', 'T02', 'T03', 'T04'].indexOf(e.jenis) >= 0;
        if (f === 'pinjaman') return ['T05', 'T06'].indexOf(e.jenis) >= 0;
        return true;
      }).slice().reverse();
      var antre = (s.antrean || []).filter(function (q) { return q.draft.anggota_id === a.id; });
      var seg = [['semua', 'Semua'], ['simpanan', 'Simpanan'], ['pinjaman', 'Pinjaman']].map(function (x) {
        return '<a class="btn sm ' + (f === x[0] ? 'dark' : 'secondary') + '" href="' + App.href('riwayat') + '?f=' + x[0] + '"' + (f === x[0] ? ' aria-current="true"' : '') + '>' + x[1] + '</a>';
      }).join('');
      var rows = list.map(function (e) {
        var n = App.ui.nominalEntri(e), arah = arahAnggota(e);
        var ket = e.jenis === 'T05' ? 'Pinjaman diterima' : e.jenis === 'T06' ? 'Angsuran dibayar' : e.jenis === 'T04' ? 'Penarikan' : 'Setoran';
        return '<div class="li"><div class="grow"><b>' + esc(e.uraian) + '</b><div class="small mute">' + tgl(e.tanggal) + ' · ' + ket + ' · ' + e.id + '</div></div><span class="amt' + (arah > 0 && e.jenis !== 'T05' ? ' plus' : '') + '">' + (arah > 0 && e.jenis !== 'T05' ? '+' : '') + rp(n) + '</span></div>';
      }).join('');
      var pj = pinjamanSaya(a.id);
      var jadwal = pj.map(function (st) {
        return '<div class="card flat"><div class="card-head"><h3>' + st.p.id + ' · ' + rp(st.p.pokok) + ', ' + st.p.tenor + ' bulan, jasa ' + String(st.p.jasa_persen).replace('.', ',') + '% per bulan</h3>' + badgePinjaman(st) + '</div>' +
          '<div class="table-wrap"><table class="t"><thead><tr><th>Ke</th><th>Jatuh tempo</th><th class="r">Pokok</th><th class="r">Jasa</th><th class="r">Jumlah</th><th>Status</th></tr></thead><tbody>' +
          st.jadwal.map(function (j, i) {
            var kum = st.jadwal.slice(0, i + 1).reduce(function (x, y) { return x + y.pokok; }, 0);
            var lunas = st.dibayar >= kum;
            var lewat = j.jatuh_tempo <= App.today();
            return '<tr><td>' + j.ke + '</td><td class="num">' + tgl(j.jatuh_tempo) + '</td><td class="r">' + rp(j.pokok) + '</td><td class="r">' + rp(j.jasa) + '</td><td class="r strong">' + rp(j.total) + '</td><td>' +
              (lunas ? '<span class="ind hijau">' + icon('check', 'sm') + 'Dibayar</span>' : lewat ? '<span class="ind merah">' + icon('alert', 'sm') + 'Tertunggak</span>' : '<span class="small mute">Belum jatuh tempo</span>') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }).join('');
      var audit = s.audit.filter(function (x) { return x.anggota_id === a.id; }).slice(-8).reverse();
      return App.pageHead('Riwayat', 'Semua transaksi atas nama Anda, jadwal angsuran, dan data pribadi yang disimpan.') +
        '<div class="stack lg"><section class="card"><div class="card-head"><h2>Transaksi</h2><div class="row" role="group" aria-label="Saring transaksi">' + seg + '</div></div>' +
        (antre.length ? App.callout('warn', 'clock', '<p>' + antre.length + ' transaksi atas nama Anda dicatat pengurus saat luring dan masih menunggu sinkron.</p>') : '') +
        (rows ? '<div class="list">' + rows + '</div>' : App.empty('list', 'Belum ada transaksi', 'Transaksi muncul di sini setelah pengurus mencatat setoran atau angsuran atas nama Anda.')) + '</section>' +
        (jadwal ? '<section class="stack"><h2>Jadwal angsuran</h2>' + jadwal + '</section>' : '') +
        '<section class="card" aria-labelledby="h-pdp"><h2 id="h-pdp">Data pribadi Anda</h2><p class="body" style="margin:6px 0 16px">Koperasi hanya menyimpan data minimal: nama, nomor anggota, dan nomor ponsel bila Anda memberikannya. Nomor KTP tidak disimpan.</p>' +
        '<dl class="dl"><dt>Nama</dt><dd>' + esc(a.nama) + '</dd><dt>Nomor anggota</dt><dd>' + a.no + '</dd><dt>Nomor ponsel</dt><dd>Tidak diberikan</dd><dt>Persetujuan</dt><dd>' +
        (a.persetujuan_pdp ? 'Diberikan ' + App.tglPanjang(a.persetujuan_pdp) + ' sesuai UU Nomor 27 Tahun 2022' : '<span class="ind merah">' + icon('x', 'sm') + 'Dicabut</span>') + '</dd></dl>' +
        '<div class="row" style="margin-top:16px"><button class="btn outline sm" data-act="pdp-unduh">' + icon('download') + 'Unduh salinan data saya</button>' +
        (a.persetujuan_pdp ? '<button class="btn ghost sm" data-act="pdp-cabut">Cabut persetujuan</button>' : '<button class="btn ghost sm" data-act="pdp-beri">Berikan persetujuan lagi</button>') + '</div>' +
        '<h3 style="margin:24px 0 6px">Siapa yang membuka data Anda</h3><p class="small mute" style="margin-bottom:8px">Setiap akses oleh peran selain anggota tercatat di log audit.</p>' +
        (audit.length ? '<div class="list">' + audit.map(function (x) { return '<div class="li"><span class="ic">' + icon('eye', 'sm') + '</span><div class="grow"><b class="small">' + esc(x.nama) + '</b><div class="small mute">' + esc(x.aksi) + ' · ' + tgl(x.tanggal) + '</div></div></div>'; }).join('') + '</div>' : '<p class="body">Belum ada akses tercatat.</p>') +
        '</section></div>';
    }
  };
  App.acts['pdp-unduh'] = function () {
    var a = aku(), s = App.state;
    var data = { anggota: { nama: a.nama, nomor_anggota: a.no, persetujuan_pdp: a.persetujuan_pdp }, saldo: TK.saldoAnggota(s, a.id),
      transaksi: s.entri.filter(function (e) { return e.anggota_id === a.id; }).map(function (e) { return { id: e.id, tanggal: e.tanggal, jenis: e.jenis, uraian: e.uraian, nominal: App.ui.nominalEntri(e) }; }),
      log_akses: s.audit.filter(function (x) { return x.anggota_id === a.id; }), catatan: 'Data simulasi TERANG-KOP.' };
    App.unduh('data-saya-' + a.no + '.json', JSON.stringify(data, null, 2));
  };
  App.acts['pdp-cabut'] = function () {
    App.confirm({ judul: 'Cabut persetujuan data pribadi?', tombol: 'Cabut persetujuan', bahaya: true,
      isi: '<p>Pengurus akan diminta menghentikan pengolahan data pribadi Anda di luar kewajiban pembukuan koperasi. Catatan simpanan dan pinjaman tetap disimpan karena diwajibkan untuk pembukuan.</p><p class="small">Di prototipe, pencabutan hanya mengubah tanda persetujuan.</p>' }).then(function (ok) {
      if (!ok) return; aku().persetujuan_pdp = null; App.save(); App.toast('Persetujuan dicabut.'); App.render();
    });
  };
  App.acts['pdp-beri'] = function () { aku().persetujuan_pdp = App.today(); App.save(); App.toast('Persetujuan diberikan.'); App.render(); };

  /* ---------- Koperasi (laporan dan skor) ---------- */
  App.views['ang/koperasi'] = {
    title: 'Koperasi',
    render: function () {
      var s = App.state;
      var terbit = s.periode.filter(function (p) { return p.status === 'Terbit'; });
      if (!terbit.length) return App.pageHead('Koperasi') + App.empty('shield', 'Belum ada laporan terbit', 'Laporan bulanan muncul di sini setelah disahkan pengawas.');
      var pt = terbit[terbit.length - 1];
      var sk = App.skorDetail(pt.id);
      var hist = terbit.map(function (p) { var r = s.skor.filter(function (x) { return x.periode_id === p.id; })[0]; return { periode: p.id, nilai: r.nilai, status: r.status }; });
      return App.pageHead('Laporan dan skor koperasi', esc(s.koperasi.nama) + '. Laporan ' + TK.namaPeriode(pt.id) + ' disahkan pengawas pada ' + App.tglPanjang(pt.disahkan_pada) + '.') +
        '<div class="stack lg">' + App.ui.ringkasSkor(sk, 'Skor ' + TK.namaPeriode(pt.id)) +
        '<section class="card"><div class="card-head"><h2>Rincian tujuh indikator</h2><a class="btn ghost sm" href="' + App.href('cara-skor') + '">' + icon('calc') + 'Cara skor dihitung</a></div>' + App.ui.tabelIndikator(sk) + '</section>' +
        '<section class="card"><h2 style="margin-bottom:4px">Riwayat skor</h2><p class="small mute" style="margin-bottom:8px">Bulan bergaris adalah masa kalibrasi.</p>' + App.ui.histori(hist) + '</section>' +
        '<section class="stack"><h2>Laporan keuangan ' + TK.namaPeriode(pt.id) + '</h2>' + App.ui.laporan(pt.id) + '</section>' +
        '<p class="small mute">Skor adalah peringatan dini agar pengurus, pengawas, anggota, dan dinas bertindak lebih awal. Skor bukan penilaian hukum.</p></div>';
    }
  };

  /* ---------- RAT ---------- */
  App.views['ang/rat'] = {
    title: 'RAT',
    render: function () {
      var s = App.state, rat = s.rat, a = aku();
      var hMin = TK.tgl.diffDays(rat.tanggal, App.today());
      var head = App.pageHead('Rapat Anggota Tahunan', 'RAT ' + App.tglPanjang(rat.tanggal) + '. e-RAT melengkapi rapat tatap muka dan tidak menggantikannya.');
      var status = '<div class="card"><div class="row between"><div><span class="label">Status</span><p class="mid" style="margin-top:4px">' + esc(rat.status) + '</p></div>' +
        '<div class="row">' + (rat.status === 'Dijadwalkan' ? App.chip(hMin > 0 ? hMin + ' hari lagi' : 'Hari ini', 'amber', 'calendar') : '') + '</div></div>' +
        (rat.status === 'Dijadwalkan' ? '<p class="body" style="margin-top:12px">Paket laporan akan dibagikan paling lambat ' + App.tglPanjang(TK.tgl.addDays(rat.tanggal, -7)) + ' (H-7). Setelah terbit, paket dikunci dan tidak dapat diubah.</p>' : '') + '</div>';
      if (!rat.paket) return head + '<div class="stack lg">' + status + '</div>';
      var dibaca = rat.dibaca[a.id];
      var paket = '<section class="card"><div class="card-head"><h2>Paket laporan RAT</h2>' + (dibaca ? App.chip('Dibaca ' + tgl(dibaca), '', 'check') : App.chip('Belum dibaca', 'amber')) + '</div>' +
        '<p class="body">Terbit ' + App.tglPanjang(rat.paket.terbit_pada) + ' (H-' + rat.paket.h_minus + '), dikunci sehingga isinya tidak bisa diubah lagi. Sidik jari digital: <span class="hash">' + App.pendek(rat.paket.hash, 12) + '</span>.</p>' +
        '<div class="row" style="margin-top:16px"><button class="btn ' + (dibaca ? 'outline' : 'primary') + '" data-act="baca-paket">' + icon('book') + (dibaca ? 'Baca lagi paket RAT' : 'Baca paket RAT') + '</button></div></section>';
      var hadir = rat.kehadiran.some(function (k) { return k.anggota_id === a.id; });
      var kuo = TK.kuorumRAT(s);
      var hari = '';
      if (rat.status === 'Berlangsung') {
        hari = '<section class="card stack"><h2>Hari RAT</h2>' +
          (hadir ? App.callout('ok', 'checkCircle', '<p>Kehadiran Anda tercatat.</p>') :
            '<form class="stack" data-form="hadir" novalidate><div class="field"><label for="kode">Kode hadir</label><input class="input mono" id="kode" name="kode" inputmode="numeric" maxlength="4" autocomplete="off" spellcheck="false" placeholder="Contoh: 1234…" style="max-width:200px;font-size:1.25rem;letter-spacing:.2em" aria-describedby="kode-h"><span class="hint" id="kode-h">Kode empat angka ditampilkan pengurus di tempat rapat.</span><span class="err" id="kode-err" role="alert"></span></div><div><button class="btn primary" type="submit">Catat kehadiran saya</button></div></form>') +

  <script>

      item('Transaksi ' + TK.namaBulan(hari.slice(0, 7)), String(bln), 'dicatat sampai ' + tgl(hari)) + '</section>';

  App.views['png/beranda'] = {

        '<div class="stack">' +
        (skT ? '<section class="card stack sm"><h2>Skor ' + TK.namaPeriode(pt.id) + '</h2><div class="row">' + App.gauge(skT.nilai, skT.status, true) + App.statusBadge(skT.status) + '</div><p class="small body">Laporan terakhir yang terbit ke anggota.</p></section>' : '') +
